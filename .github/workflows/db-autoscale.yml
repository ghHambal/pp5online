name: DB schedule (manual tick — same Edge Function and lease)

on:
  workflow_dispatch:
    inputs:
      test_notify_only:
        description: 'ทดสอบแจ้งเตือนเท่านั้น ไม่ปรับเครื่อง'
        type: boolean
        default: false

concurrency:
  group: db-autoscale
  cancel-in-progress: false

permissions:
  contents: read

env:
  SUPABASE_PROJECT_REF: isupghduywzqbmnjgtip

jobs:
  autoscale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: เรียกตารางเวลาร่วม (ไม่ใช้ตัวนับเก่า)
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TEST_NOTIFY_ONLY: ${{ inputs.test_notify_only }}
        run: |
          if [ "$TEST_NOTIFY_ONLY" = "true" ]; then
            node scripts/db-autoscale.mjs --test-notify
          else
            node scripts/db-autoscale.mjs
          fi
