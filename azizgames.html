<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/12LFb-wrdhwJH9qHHnWP6KAorwq306rjf" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AZIZGAMES กีฬาสีออนไลน์</title>
    <script>
      (async () => {
        const base = location.pathname.startsWith('/pp5online/') ? '/pp5online/' : '/';
        const version = '10.22.808';
        const stylesheet = document.createElement('link');
        stylesheet.rel = 'stylesheet';
        stylesheet.crossOrigin = 'anonymous';
        stylesheet.href = `${base}azizgames/assets/index-B_roTS1t.css?v=${version}`;
        document.head.appendChild(stylesheet);

        let active = false;
        try {
          const { getWorkloadState } = await import(`${base}js/workload-scheduler.js?v=${version}`);
          active = (await getWorkloadState('azizgames')).active;
        } catch (error) {
          console.warn('AZIZGAMES workload schedule unavailable; live workload is paused', error);
        }
        window.__pp5Workload = { isActive: key => key === 'azizgames' ? active : true };
        window.addEventListener('storage', event => {
          if (event.key === 'pp5:workloadSchedule') window.location.reload();
        });
        ['azizgames/assets/index-DMQe507M.js', 'azizgames-public-controls.js'].forEach((src) => {
          const script = document.createElement('script');
          script.type = 'module';
          script.crossOrigin = 'anonymous';
          script.src = `${base}${src}?v=${version}`;
          document.head.appendChild(script);
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
