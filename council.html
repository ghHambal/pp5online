<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#14563b" />
  <title>ระบบสภานักเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css?v=202606082700" />
</head>

<body class="bg-[#f8f4f4] flex h-screen overflow-hidden">

  <!-- ─── Sidebar (จอกว้าง md ขึ้นไป) ─────────────────────────────────────────── -->
  <aside id="council-sidebar" class="hidden md:flex md:flex-col w-64 bg-[#0a2d1f] text-white flex-shrink-0 h-screen">
    <div class="px-4 py-4 border-b border-[#0a2d1f] flex-shrink-0">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 rounded-full bg-[#0a2d1f] border border-[#0d3a28] flex-shrink-0 flex items-center justify-center overflow-hidden">
          <img id="council-logo" src="" alt="" class="w-full h-full object-contain hidden"/>
          <span id="council-logo-fallback" class="text-lg">🏛️</span>
        </div>
        <div class="min-w-0">
          <p id="council-title" class="text-sm font-bold leading-tight truncate">ระบบสภานักเรียน</p>
          <p class="text-[11px] text-[#9cc4b0]">ปพ.5 ออนไลน์</p>
        </div>
      </div>
    </div>
    <nav id="council-sidebar-nav" class="flex-1 p-3 space-y-1 overflow-y-auto"></nav>
    <div class="p-3 border-t border-[#0a2d1f] flex-shrink-0">
      <a id="council-back-btn-desktop" href="index.html"
        class="flex items-center gap-3 px-4 py-2.5 rounded-xl text-sm font-medium text-[#b9d6c7] hover:bg-[#0a2d1f] hover:text-white transition">
        <span>←</span> กลับ ปพ.5 ออนไลน์
      </a>
    </div>
  </aside>

  <!-- ─── Main column ─────────────────────────────────────────────────────────── -->
  <div class="flex-1 flex flex-col min-w-0 h-screen overflow-hidden">

    <!-- Top header (มือถือ: โลโก้+ชื่อ+ย้อนกลับ / เดสก์ท็อป: แค่รีเฟรช เพราะไซด์บาร์มีครบแล้ว) -->
    <header class="bg-white border-b border-[#f1e9e9] shadow-[0_1px_3px_rgba(0,0,0,0.25)] flex-shrink-0 z-30">
      <div class="px-4 md:px-6 h-14 flex items-center justify-between">
        <div class="flex items-center gap-2 min-w-0 md:hidden">
          <a id="council-back-btn-mobile" href="index.html" title="กลับไป ปพ.5 ออนไลน์"
            class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-full text-[#90828a] hover:bg-[#edf4f0] hover:text-[#14563b] transition text-lg">
            ←
          </a>
          <p id="council-title-mobile" class="text-sm font-bold text-[#4a3b41] truncate">ระบบสภานักเรียน</p>
        </div>
        <p id="council-view-title" class="hidden md:block text-lg font-bold text-[#1d1519]">ภาพรวม</p>
        <button onclick="window.location.reload()" title="รีเฟรชหน้านี้"
          class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-full text-[#90828a] hover:bg-[#edf4f0] hover:text-[#14563b] transition text-base">
          ↺
        </button>
      </div>
    </header>

    <!-- Page Content -->
    <main id="council-content" class="flex-1 overflow-y-auto pb-20 md:pb-0">
      <div class="flex justify-center py-16 text-[#90828a]">
        <svg class="animate-spin h-6 w-6 text-[#6ba888]" viewBox="0 0 24 24" fill="none">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
        </svg>
      </div>
    </main>

    <!-- Bottom tab bar (มือถือเท่านั้น) -->
    <nav id="council-bottom-tabs" class="md:hidden bg-white border-t border-[#f1e9e9] shadow-[0_-1px_4px_rgba(0,0,0,0.06)] flex-shrink-0 fixed bottom-0 inset-x-0 z-30 safe-area-bottom"></nav>
  </div>

  <script type="module" src="/js/council.js"></script>
</body>
</html>
