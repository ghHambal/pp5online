<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#7c3aed" />
  <title>ระบบสภานักเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css?v=202606082700" />
</head>

<body class="bg-gray-50 flex flex-col min-h-screen">

  <!-- ─── Top Header ──────────────────────────────────────────────────────────── -->
  <header class="bg-white border-b border-gray-100 shadow-sm flex-shrink-0 sticky top-0 z-30">
    <div class="max-w-2xl mx-auto px-4 sm:px-6 h-14 flex items-center justify-between">
      <div class="flex items-center gap-2 min-w-0">
        <a id="council-back-btn" href="index.html" title="กลับไป ปพ.5 ออนไลน์"
          class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-full text-gray-400 hover:bg-violet-50 hover:text-violet-600 transition text-lg">
          ←
        </a>
        <div class="w-9 h-9 rounded-full bg-violet-50 border border-violet-100 flex-shrink-0 flex items-center justify-center overflow-hidden">
          <img id="council-logo" src="" alt="" class="w-full h-full object-contain hidden"/>
          <span id="council-logo-fallback" class="text-lg">🏛️</span>
        </div>
        <p id="council-title" class="text-sm font-bold text-gray-700 truncate">ระบบสภานักเรียน</p>
      </div>
      <button onclick="window.location.reload()" title="รีเฟรชหน้านี้"
        class="w-8 h-8 flex-shrink-0 flex items-center justify-center rounded-full text-gray-400 hover:bg-violet-50 hover:text-violet-600 transition text-base">
        ↺
      </button>
    </div>
  </header>

  <!-- ─── Page Content ────────────────────────────────────────────────────────── -->
  <main id="council-content" class="flex-1">
    <div class="flex justify-center py-16 text-gray-400">
      <svg class="animate-spin h-6 w-6 text-violet-400" viewBox="0 0 24 24" fill="none">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"/>
      </svg>
    </div>
  </main>

  <script type="module" src="/js/council.js"></script>
</body>
</html>
