<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ปพ.5 ออนไลน์ — เข้าสู่ระบบ</title>

  <!-- Google Fonts: Sarabun (Thai) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS (CDN) -->
  

  <!-- Custom styles -->
  <link rel="stylesheet" href="/css/main.css" />
</head>

<body class="login-bg flex items-center justify-center p-4">

  <!-- ─── Login Card ────────────────────────────────────────────────────────── -->
  <div class="login-card rounded-3xl shadow-2xl w-full max-w-md p-8 sm:p-10">

    <!-- Logo + Title -->
    <div class="flex flex-col items-center mb-8">
      <div class="logo-ring mb-4">
        <div class="logo-inner">
          <!-- School icon — swap with <img src="..."> for actual logo -->
          <svg class="w-9 h-9 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 14l9-5-9-5-9 5 9 5zm0 0v6m-4-4h8" />
          </svg>
        </div>
      </div>

      <h1 class="text-2xl font-bold text-gray-800 tracking-tight">ปพ.5 ออนไลน์</h1>
      <p class="text-sm text-gray-500 mt-1">ระบบสมุดคะแนนดิจิทัลสำหรับครู</p>
    </div>

    <!-- Login Form -->
    <form id="login-form" novalidate class="space-y-5">

      <!-- Login identifier -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">
          อีเมล / ยูเซอร์เนม / รหัสครู
        </label>
        <input
          id="email"
          type="text"
          autocomplete="username"
          placeholder="teacher@school.ac.th หรือ 1095"
          required
          class="input-field w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-800 placeholder-gray-400"
        />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-700 mb-1">
          รหัสผ่าน
        </label>
        <div class="relative">
          <input
            id="password"
            type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
            class="input-field w-full border border-gray-300 rounded-xl px-4 py-3 pr-12 text-sm text-gray-800 placeholder-gray-400"
          />
          <button
            type="button"
            id="toggle-password"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-lg leading-none"
            tabindex="-1"
          >
            <span id="eye-icon">👁️</span>
          </button>
        </div>
      </div>

      <!-- Forgot password -->
      <div class="text-right -mt-2">
        <a href="#" class="text-xs text-indigo-500 hover:text-indigo-700">ลืมรหัสผ่าน?</a>
      </div>

      <!-- Submit -->
      <button
        id="btn-login"
        type="submit"
        class="btn-primary w-full text-white font-semibold py-3 rounded-xl text-sm"
      >
        เข้าสู่ระบบ
      </button>

    </form>

    <!-- Register toggle -->
    <p class="text-center text-sm text-gray-500 mt-6">
      ยังไม่มีบัญชี?
      <button id="btn-show-register" type="button"
        class="text-indigo-600 font-semibold hover:text-indigo-800 ml-1">
        ลงทะเบียนเข้าใช้งาน
      </button>
    </p>
  </div>

  <!-- ─── Register Card ───────────────────────────────────────── -->
  <div id="register-card"
    class="login-card rounded-3xl shadow-2xl w-full max-w-md p-8 sm:p-10 hidden">

    <div class="flex flex-col items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800 tracking-tight">ลงทะเบียนเข้าใช้งาน</h1>
      <p class="text-sm text-gray-500 mt-1">สมัครบัญชีสำหรับครู/บุคลากร</p>
    </div>

    <form id="register-form" novalidate class="space-y-4">
      <!-- รหัสครู (บนสุด + auto-fill) -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">รหัสครู <span class="text-xs text-gray-400">(ถ้ามี)</span></label>
        <input id="reg-code" type="text" placeholder="เช่น 101" autocomplete="off"
          class="input-field w-full border border-gray-300 rounded-xl px-4 py-3 text-sm" />
        <!-- teacher preview -->
        <div id="reg-teacher-preview" class="hidden mt-2 flex items-center gap-2 px-3 py-2
          bg-emerald-50 border border-emerald-200 rounded-xl text-sm text-emerald-700">
          <span>✓</span>
          <span id="reg-teacher-name" class="font-medium"></span>
          <span id="reg-teacher-dept" class="text-xs text-emerald-500 ml-auto"></span>
        </div>
        <p id="reg-code-msg" class="hidden text-xs text-red-500 mt-1"></p>
        <p class="text-xs text-gray-400 mt-1.5">
          ยังไม่มีรหัสครู?
          <button type="button" id="btn-request-code"
            class="text-indigo-500 hover:text-indigo-700 underline font-medium">
            ลงทะเบียนขอรหัสครู
          </button>
        </p>
      </div>
      <input type="hidden" id="reg-teacher-id" />

      <!-- ─── ค้นหาด้วยชื่อ ─── -->
      <div>
        <div class="flex items-center gap-3 mb-3">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span class="text-xs text-gray-400 whitespace-nowrap">หรือค้นหาด้วยชื่อ</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>
        <div class="relative">
          <span class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 pointer-events-none text-base">🔍</span>
          <input id="reg-name-search" type="text" autocomplete="off"
            placeholder="พิมพ์ชื่อหรือนามสกุลบางส่วน..."
            class="input-field w-full border border-gray-300 rounded-xl pl-10 pr-4 py-3 text-sm" />
          <!-- Dropdown results -->
          <div id="reg-name-results"
            class="hidden absolute z-20 left-0 right-0 top-full mt-1
                   bg-white border border-gray-200 rounded-xl shadow-xl
                   max-h-52 overflow-y-auto">
          </div>
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">ชื่อ-นามสกุล <span class="text-red-400">*</span></label>
        <input id="reg-name" type="text" placeholder="ระบบจะเติมให้เมื่อกรอกรหัสครู" required
          class="input-field w-full border border-gray-300 rounded-xl px-4 py-3 text-sm" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">อีเมล <span class="text-red-400">*</span></label>
        <input id="reg-email" type="email" placeholder="teacher@school.ac.th" required
          class="input-field w-full border border-gray-300 rounded-xl px-4 py-3 text-sm" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน <span class="text-red-400">*</span></label>
        <input id="reg-password" type="password" placeholder="อย่างน้อย 6 ตัวอักษร" required
          class="input-field w-full border border-gray-300 rounded-xl px-4 py-3 text-sm" />
      </div>

      <div id="reg-msg" class="hidden text-sm text-center py-3 rounded-xl"></div>

      <button id="btn-register" type="submit"
        class="btn-primary w-full text-white font-semibold py-3 rounded-xl text-sm">
        สมัครสมาชิก
      </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-5">
      มีบัญชีแล้ว?
      <button id="btn-show-login" type="button"
        class="text-indigo-600 font-semibold hover:text-indigo-800 ml-1">
        เข้าสู่ระบบ
      </button>
    </p>
  </div>

  <!-- ─── Modal: ลงทะเบียนขอรหัสครู ─────────────────────────────────────── -->
  <div id="modal-request-code"
    class="hidden fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/50">
    <div class="login-card rounded-3xl shadow-2xl w-full max-w-md p-8">

      <div class="flex flex-col items-center mb-6">
        <div class="w-14 h-14 rounded-2xl bg-indigo-100 flex items-center justify-center mb-3">
          <span class="text-2xl">🪪</span>
        </div>
        <h2 class="text-xl font-bold text-gray-800">ลงทะเบียนขอรหัสครู</h2>
        <p class="text-sm text-gray-500 mt-1 text-center">
          ระบบจะออกรหัสครูให้อัตโนมัติ<br/>
          <span class="text-indigo-500 font-medium">ครูสามัญ → 1xx &nbsp;|&nbsp; ครูศาสนา → 2xx</span>
        </p>
      </div>

      <form id="request-code-form" class="space-y-4">
        <!-- คำนำหน้า + ชื่อ-นามสกุล -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">
            ชื่อ-นามสกุล <span class="text-red-400">*</span>
          </label>
          <div class="flex gap-2">
            <select id="rc-prefix"
              class="input-field border border-gray-300 rounded-xl px-3 py-3 text-sm bg-white flex-shrink-0 w-36">
              <option value="">-- คำนำหน้า --</option>
              <option value="นาย">นาย</option>
              <option value="นาง">นาง</option>
              <option value="นางสาว">นางสาว</option>
              <option value="ว่าที่ ร.ต.">ว่าที่ ร.ต.</option>
              <option value="ว่าที่ ร.ต.หญิง">ว่าที่ ร.ต.หญิง</option>
              <option value="อุสตาซ">อุสตาซ</option>
              <option value="อุสตาซะฮ์">อุสตาซะฮ์</option>
            </select>
            <input id="rc-name" type="text" placeholder="ชื่อ-นามสกุล" required
              class="input-field flex-1 border border-gray-300 rounded-xl px-4 py-3 text-sm" />
          </div>
          <p id="rc-prefix-msg" class="hidden text-xs text-red-500 mt-1">กรุณาเลือกคำนำหน้า</p>
        </div>

        <!-- ประเภทครู -->
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-2">
            ประเภทครู <span class="text-red-400">*</span>
          </label>
          <div class="grid grid-cols-2 gap-3">
            <label id="rc-opt-saman"
              class="flex items-center gap-2 px-4 py-3 rounded-xl border-2 border-indigo-400 bg-indigo-50 cursor-pointer transition">
              <input type="radio" name="rc-category" value="สามัญ" checked class="accent-indigo-600" />
              <span class="text-sm font-medium text-indigo-700">ครูสามัญ</span>
            </label>
            <label id="rc-opt-sasana"
              class="flex items-center gap-2 px-4 py-3 rounded-xl border-2 border-gray-200 cursor-pointer transition">
              <input type="radio" name="rc-category" value="ศาสนา" class="accent-indigo-600" />
              <span class="text-sm font-medium text-gray-600">ครูศาสนา</span>
            </label>
          </div>
        </div>

        <div id="rc-msg" class="hidden text-sm text-center py-3 rounded-xl"></div>

        <div class="flex gap-3 pt-1">
          <button type="button" id="btn-cancel-rc"
            class="flex-1 py-3 rounded-xl text-sm font-medium border border-gray-300
                   text-gray-600 hover:bg-gray-50 transition">
            ยกเลิก
          </button>
          <button type="submit" id="btn-submit-rc"
            class="flex-1 btn-primary text-white font-semibold py-3 rounded-xl text-sm">
            ขอรหัสครู
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Auth logic (ES Module) -->
  <script type="module" src="js/auth.js"></script>
</body>
</html>
