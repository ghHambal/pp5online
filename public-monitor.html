<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ปพ.5 ออนไลน์ — ศูนย์ติดตามสาธารณะ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Sarabun', sans-serif; }
    .monitor-frame { width: 100%; height: 100%; border: 0; background: #f8fafc; }
    .mode-combined #prayer-panel { display: block; }
    .mode-combined #leave-panel { display: block; }
    .mode-prayer #prayer-panel { display: block; }
    .mode-prayer #leave-panel { display: none; }
    .mode-leave #prayer-panel { display: none; }
    .mode-leave #leave-panel { display: block; }
    .mode-prayer #monitor-grid,
    .mode-leave #monitor-grid { grid-template-columns: minmax(0, 1fr); }
    .mode-prayer #prayer-panel,
    .mode-leave #leave-panel { min-height: calc(100vh - 86px); }
  </style>
  <link rel="stylesheet" crossorigin href="/pp5online/assets/main-Cep-5RXG.css">
</head>
<body class="bg-slate-950 text-white min-h-screen overflow-hidden mode-combined">
  <main class="h-screen flex flex-col">
    <header class="h-[86px] flex-shrink-0 px-5 py-3 bg-slate-950 border-b border-white/10 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <button type="button" onclick="if (history.length > 1) { history.back(); } else { location.href = '/teacher.html'; }"
          class="flex-shrink-0 text-sm font-semibold text-slate-300 hover:text-white flex items-center gap-1 px-2 py-1.5 rounded-lg hover:bg-white/10 transition">
          <span>←</span><span class="hidden sm:inline">กลับ</span>
        </button>
        <div class="w-11 h-11 rounded-2xl bg-white/10 flex items-center justify-center text-2xl">📡</div>
        <div class="min-w-0">
          <h1 class="text-lg sm:text-xl font-extrabold truncate">ศูนย์ติดตามสาธารณะ</h1>
          <p class="text-xs text-slate-400 truncate">แนวโน้มละหมาด · การออกนอกห้องเรียน</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button type="button" data-mode="combined" class="monitor-mode px-3 py-2 rounded-xl bg-white text-slate-900 text-xs font-bold">รวม</button>
        <button type="button" data-mode="prayer" class="monitor-mode px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold">ละหมาด</button>
        <button type="button" data-mode="leave" class="monitor-mode px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold">ออกนอกห้อง</button>
      </div>
    </header>

    <section id="monitor-grid" class="flex-1 min-h-0 grid grid-cols-1 xl:grid-cols-[1.05fr_1fr] gap-3 p-3">
      <div id="prayer-panel" class="min-h-0 rounded-2xl overflow-hidden border border-white/10 bg-slate-100">
        <iframe class="monitor-frame" src="prayer-dashboard.html?days=14" title="แดชบอร์ดแนวโน้มการละหมาด"></iframe>
      </div>
      <div id="leave-panel" class="min-h-0 rounded-2xl overflow-hidden border border-white/10 bg-slate-100">
        <iframe class="monitor-frame" src="leave-monitor.html?view=dashboard&days=14" title="จอติดตามการออกนอกห้อง"></iframe>
      </div>
    </section>
  </main>

  <script>
    const buttons = Array.from(document.querySelectorAll('.monitor-mode'))
    function setMode(mode) {
      document.body.classList.remove('mode-combined', 'mode-prayer', 'mode-leave')
      document.body.classList.add(`mode-${mode}`)
      buttons.forEach(btn => {
        const active = btn.dataset.mode === mode
        btn.className = active
          ? 'monitor-mode px-3 py-2 rounded-xl bg-white text-slate-900 text-xs font-bold'
          : 'monitor-mode px-3 py-2 rounded-xl bg-white/10 hover:bg-white/20 text-xs font-bold'
      })
    }
    buttons.forEach(btn => btn.addEventListener('click', () => setMode(btn.dataset.mode || 'combined')))
  </script>
</body>
</html>
