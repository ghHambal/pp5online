<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/pp5online/manifest.json" />
  <meta name="theme-color" content="#10b981" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="ปพ.5 ออนไลน์" />
  <link rel="apple-touch-icon" href="/pp5online/vite.svg" />
  <title>ปพ.5 ออนไลน์ — เข้าสู่ระบบนักเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css?v=202606082200" />
  <script type="module">
    import { applyThemeForRole } from './js/theme.js'
    applyThemeForRole('student')
  </script>
</head>

<body class="login-bg flex items-center justify-center min-h-screen p-4">

  <div class="login-card rounded-3xl shadow-2xl w-full max-w-md p-8 sm:p-10">

    <!-- Logo + Title -->
    <div class="flex flex-col items-center mb-8">
      <div class="logo-ring mb-4">
        <div class="logo-inner">
          <img data-theme-logo src="" alt="" class="hidden w-full h-full object-contain rounded-full" />
          <svg data-theme-logo-fallback class="w-9 h-9 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 14l9-5-9-5-9 5 9 5zm0 0v6m-4-4h8" />
          </svg>
        </div>
      </div>
      <h1 id="student-login-title" class="text-2xl font-bold text-gray-800">เข้าสู่ระบบนักเรียน</h1>
      <p id="school-name" class="text-sm text-gray-400 mt-1">ปพ.5 ออนไลน์</p>
    </div>

    <!-- ─── Step 1: กรอกรหัสนักเรียน ─── -->
    <div id="step-code">
      <p class="text-xs text-gray-500 text-center mb-5">กรอกรหัสนักเรียนของคุณเพื่อเริ่มต้น</p>
      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">รหัสนักเรียน</label>
          <input id="inp-code" type="text" inputmode="numeric"
            placeholder="เช่น 26826" autofocus
            class="input-field w-full border border-gray-300 rounded-xl px-4 py-3 text-sm font-mono tracking-wider text-center text-lg" />
        </div>
        <div id="step1-msg" class="hidden text-sm text-center py-2.5 rounded-xl"></div>
        <button id="btn-next"
          class="btn-primary w-full text-white font-semibold py-3 rounded-xl text-sm">
          ถัดไป →
        </button>
      </div>
    </div>

    <!-- ─── Step 2A: มีบัญชีแล้ว → กรอกรหัสผ่าน ─── -->
    <div id="step-login" class="hidden">
      <!-- Student preview -->
      <div id="stu-preview" class="flex items-center gap-3 bg-emerald-50 border border-emerald-100 rounded-2xl px-4 py-3 mb-5">
        <div id="stu-avatar"
          class="w-10 h-10 rounded-full bg-gradient-to-tr from-emerald-400 to-teal-400
                 flex items-center justify-center text-white font-bold text-sm flex-shrink-0 overflow-hidden">
          ?
        </div>
        <div class="min-w-0">
          <p id="stu-name" class="font-semibold text-gray-800 text-sm truncate">—</p>
          <p id="stu-room" class="text-xs text-gray-400 mt-0.5">—</p>
        </div>
        <button id="btn-change-code" class="ml-auto text-xs text-gray-400 hover:text-gray-600 flex-shrink-0">เปลี่ยน</button>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">รหัสผ่าน</label>
          <div class="relative">
            <input id="inp-password" type="password" autocomplete="current-password"
              placeholder="••••••••"
              class="input-field w-full border border-gray-300 rounded-xl px-4 py-3 pr-12 text-sm" />
            <button type="button" id="toggle-pw"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-lg leading-none" tabindex="-1">
              <span id="eye-icon">👁️</span>
            </button>
          </div>
        </div>
        <!-- Forgot password -->
        <div class="text-right -mt-2">
          <button id="btn-forgot-pw" type="button" class="text-xs text-indigo-500 hover:text-indigo-700">ลืมรหัสผ่าน?</button>
        </div>
        <div id="login-msg" class="hidden text-sm text-center py-2.5 rounded-xl"></div>
        <button id="btn-login"
          class="btn-primary w-full text-white font-semibold py-3 rounded-xl text-sm">
          เข้าสู่ระบบ
        </button>
      </div>
    </div>

    <!-- ─── Step 2B: ครั้งแรก → ตั้งรหัสผ่าน ─── -->
    <div id="step-register" class="hidden">
      <div id="stu-preview-reg" class="flex items-center gap-3 bg-indigo-50 border border-indigo-100 rounded-2xl px-4 py-3 mb-2">
        <div id="stu-avatar-reg"
          class="w-10 h-10 rounded-full bg-gradient-to-tr from-indigo-400 to-purple-400
                 flex items-center justify-center text-white font-bold text-sm flex-shrink-0 overflow-hidden">
          ?
        </div>
        <div class="min-w-0">
          <p id="stu-name-reg" class="font-semibold text-gray-800 text-sm truncate">—</p>
          <p id="stu-room-reg" class="text-xs text-gray-400 mt-0.5">—</p>
        </div>
        <button id="btn-change-code-reg" class="ml-auto text-xs text-gray-400 hover:text-gray-600 flex-shrink-0">เปลี่ยน</button>
      </div>
      <p class="text-xs text-indigo-600 text-center mb-4">🎉 ยินดีต้อนรับ! ตั้งรหัสผ่านสำหรับครั้งถัดไป</p>

      <div class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">ตั้งรหัสผ่าน <span class="text-gray-400 font-normal">(อย่างน้อย 6 ตัว)</span></label>
          <div class="relative">
            <input id="inp-new-pw" type="password" autocomplete="new-password"
              placeholder="ตั้งรหัสผ่านที่จำง่าย"
              class="input-field w-full border border-gray-300 rounded-xl px-4 py-3 pr-12 text-sm" />
            <button type="button" id="toggle-new-pw"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-lg leading-none" tabindex="-1">
              <span id="eye-icon-new">👁️</span>
            </button>
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">ยืนยันรหัสผ่าน</label>
          <input id="inp-confirm-pw" type="password" autocomplete="new-password"
            placeholder="กรอกรหัสผ่านอีกครั้ง"
            class="input-field w-full border border-gray-300 rounded-xl px-4 py-3 text-sm" />
        </div>
        <div id="reg-msg" class="hidden text-sm text-center py-2.5 rounded-xl"></div>
        <button id="btn-create-account"
          class="btn-primary w-full text-white font-semibold py-3 rounded-xl text-sm">
          สร้างบัญชีและเข้าสู่ระบบ
        </button>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">
      คุณครู?
      <a href="index.html" class="text-indigo-500 hover:text-indigo-700 font-medium">เข้าสู่ระบบครู →</a>
    </p>
    <p data-dev-credit class="text-center text-[11px] text-gray-400 mt-4">พัฒนาโดย KruHambalWaji</p>
    <p id="login-stats" class="text-center text-[10px] text-gray-300 mt-1"></p>
  </div>

  <!-- Modal: ลืมรหัสผ่าน (Forgot Password) -->
  <div id="modal-forgot-pw" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 animate-fade">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-5 relative">
      <h3 class="font-bold text-gray-800 text-base mb-4 flex items-center gap-1.5">🔑 ยืนยันข้อมูลนักเรียนเพื่อรีเซ็ต</h3>
      <button id="forgot-pw-close" class="absolute right-4 top-4 text-gray-400 hover:text-gray-600 text-lg">✕</button>
      
      <form id="forgot-pw-form" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">รหัสนักเรียน</label>
          <input id="forgot-code" type="text" placeholder="กรอกรหัสนักเรียน" required
            class="input-field w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">ชื่อ-นามสกุลจริง</label>
          <input id="forgot-name" type="text" placeholder="เช่น เด็กชาย สมชาย เรียนดี" required
            class="input-field w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">ห้องเรียนประจำ</label>
          <input id="forgot-room" type="text" placeholder="เช่น ม.4/1" required
            class="input-field w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">อีเมลจริงสำหรับรับลิงก์รีเซ็ต</label>
          <input id="forgot-email" type="email" placeholder="เช่น name@gmail.com" required autocomplete="email" inputmode="email"
            class="input-field w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm" />
        </div>
        <div id="forgot-pw-msg" class="hidden text-xs text-center py-2.5 rounded-xl"></div>
        <button id="btn-submit-forgot" type="submit"
          class="btn-primary w-full text-white font-semibold py-2.5 rounded-xl text-sm transition">
          ขอลิงก์รีเซ็ตรหัสผ่าน
        </button>
      </form>
    </div>
  </div>

  <!-- Modal: ตั้งรหัสผ่านใหม่ (Reset Password) -->
  <div id="modal-reset-pw" class="hidden fixed inset-0 z-[60] flex items-center justify-center bg-black/50 p-4 animate-fade">
    <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-5 relative">
      <h3 class="font-bold text-gray-800 text-base mb-4 flex items-center gap-1.5">🔒 ตั้งรหัสผ่านใหม่</h3>
      
      <form id="reset-pw-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">รหัสผ่านใหม่ (อย่างน้อย 6 ตัว)</label>
          <input id="reset-pw-new" type="password" placeholder="พิมพ์รหัสผ่านใหม่" required
            class="input-field w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm" />
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">ยืนยันรหัสผ่านใหม่อีกครั้ง</label>
          <input id="reset-pw-confirm" type="password" placeholder="พิมพ์ซ้ำอีกครั้ง" required
            class="input-field w-full border border-gray-300 rounded-xl px-4 py-2.5 text-sm" />
        </div>
        <div id="reset-pw-msg" class="hidden text-xs text-center py-2.5 rounded-xl"></div>
        <button id="btn-submit-reset" type="submit"
          class="btn-primary w-full text-white font-semibold py-2.5 rounded-xl text-sm transition">
          บันทึกรหัสผ่านใหม่
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { supabase } from '/js/supabase.js'
    import { blockPullToRefresh } from '/js/anti-pull-refresh.js'

    blockPullToRefresh()

    // อนุญาตเฉพาะชื่อไฟล์ .html ธรรมดาในโดเมนเดียวกัน กัน open-redirect
    function getSafeNextUrl() {
      const next = new URLSearchParams(window.location.search).get('next')
      if (next && /^[a-zA-Z0-9_-]+\.html$/.test(next)) return next
      return null
    }
    const _nextUrl = getSafeNextUrl()

    ;(async () => {
    // ─── Redirect if already logged in ───────────────────────────────────────
    const { data: { session } } = await supabase.auth.getSession()
    const isRecovery = window.location.hash.includes('type=recovery') || window.location.search.includes('type=recovery')
    if (session && !isRecovery) {
      const { data: p } = await supabase.from('profiles').select('role').eq('id', session.user.id).single()
      if (p?.role === 'student') { window.location.replace(_nextUrl || 'student.html'); }
    }

    // ─── Load school name ─────────────────────────────────────────────────────
    try {
      const { data } = await supabase.from('system_config').select('key,value')
        .in('key', ['studentLoginTitle','studentLoginSubtitle','samaiSchoolName','mainSchoolName','developerCreditText'])
      const cfg = Object.fromEntries((data ?? []).map(r => [r.key, r.value]))
      if (cfg.studentLoginTitle) document.getElementById('student-login-title').textContent = cfg.studentLoginTitle
      const subtitle = cfg.studentLoginSubtitle || cfg.samaiSchoolName || cfg.mainSchoolName
      if (subtitle) document.getElementById('school-name').textContent = subtitle
      if (cfg.developerCreditText) {
        document.querySelectorAll('[data-dev-credit]').forEach(el => { el.textContent = cfg.developerCreditText })
      }
    } catch { /* ignore */ }

    // ─── Load student login stats ────────────────────────────────────────────
    try {
      const now = new Date()
      const todayIso = new Date(now.getFullYear(), now.getMonth(), now.getDate()).toISOString()
      const monthIso = new Date(now.getFullYear(), now.getMonth(), 1).toISOString()
      const [todayRes, monthRes, totalRes] = await Promise.all([
        supabase.from('login_logs').select('id', { count: 'exact', head: true }).eq('user_type','student').gte('logged_at', todayIso),
        supabase.from('login_logs').select('id', { count: 'exact', head: true }).eq('user_type','student').gte('logged_at', monthIso),
        supabase.from('login_logs').select('id', { count: 'exact', head: true }).eq('user_type','student'),
      ])
      const el = document.getElementById('login-stats')
      if (el) el.textContent = `🎒 นักเรียน: วันนี้ ${todayRes.count ?? 0} คน · เดือนนี้ ${monthRes.count ?? 0} คน · ทั้งหมด ${totalRes.count ?? 0} คน`
    } catch { /* ignore */ }

    // ─── State ────────────────────────────────────────────────────────────────
    let _student = null   // {id, student_code, full_name, main_room, image_url, profile_id}
    let _email   = null   // email ที่จะใช้ login

    // ─── Helpers ─────────────────────────────────────────────────────────────
    const show = (id) => document.getElementById(id).classList.remove('hidden')
    const hide = (id) => document.getElementById(id).classList.add('hidden')

    function showMsg(elId, text, type) {
      const el = document.getElementById(elId)
      el.className = `text-sm text-center py-2.5 rounded-xl ${
        type === 'error' ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-700'
      }`
      el.textContent = text
      el.classList.remove('hidden')
    }

    function fillPreview(nameSuffix, stu) {
      const avatarEl = document.getElementById('stu-avatar' + nameSuffix)
      const nameEl   = document.getElementById('stu-name'  + nameSuffix)
      const roomEl   = document.getElementById('stu-room'  + nameSuffix)
      nameEl.textContent = stu.full_name
      roomEl.textContent = `รหัส ${stu.student_code}${stu.main_room ? ' · ห้อง ' + stu.main_room : ''}`
      if (stu.image_url) {
        avatarEl.innerHTML = `<img src="${stu.image_url}" class="w-full h-full object-cover"/>`
      } else {
        avatarEl.textContent = (stu.full_name ?? 'น').charAt(0)
      }
    }

    function goBack() {
      hide('step-login'); hide('step-register')
      show('step-code')
      document.getElementById('inp-code').focus()
    }

    // ─── Toggle password visibility ───────────────────────────────────────────
    ;[['toggle-pw','inp-password','eye-icon'], ['toggle-new-pw','inp-new-pw','eye-icon-new']].forEach(([btn,inp,ico]) => {
      document.getElementById(btn)?.addEventListener('click', () => {
        const el = document.getElementById(inp)
        el.type = el.type === 'password' ? 'text' : 'password'
        document.getElementById(ico).textContent = el.type === 'password' ? '👁️' : '🙈'
      })
    })
    document.getElementById('btn-change-code').addEventListener('click', goBack)
    document.getElementById('btn-change-code-reg').addEventListener('click', goBack)

    // ─── Step 1: ตรวจสอบรหัสนักเรียน ─────────────────────────────────────────
    async function handleNext() {
      const code = document.getElementById('inp-code').value.trim()
      if (!code) { showMsg('step1-msg', 'กรุณากรอกรหัสนักเรียน', 'error'); return }

      const btn = document.getElementById('btn-next')
      btn.disabled = true; btn.textContent = 'กำลังตรวจสอบ...'
      hide('step1-msg')

      try {
        // ใช้ SECURITY DEFINER function เพื่อให้ anon user ค้นหาได้
        const { data: rows, error: lookupErr } = await supabase
          .rpc('lookup_student_by_code', { p_student_code: code })

        if (lookupErr) {
          console.error('[lookup_student_by_code]', lookupErr)
          showMsg('step1-msg', 'เกิดข้อผิดพลาดระบบ: ' + (lookupErr.message ?? '') + ' — กรุณาติดต่อผู้ดูแล', 'error')
          btn.disabled = false; btn.textContent = 'ถัดไป →'; return
        }

        const stu = rows?.[0] ?? null
        if (!stu) {
          showMsg('step1-msg', 'ไม่พบรหัสนักเรียน "' + code + '" ในระบบ', 'error')
          btn.disabled = false; btn.textContent = 'ถัดไป →'; return
        }

        _student = stu
        hide('step-code')

        if (stu.has_account) {
          // มีบัญชีแล้ว → ใช้ login_email ที่ function คืนมาโดยตรง
          _email = stu.login_email
          fillPreview('', stu)
          show('step-login')
          document.getElementById('inp-password').focus()
        } else {
          // ครั้งแรก → ให้ตั้งรหัสผ่าน
          _email = `stu${stu.student_code}@student.pp5.local`
          fillPreview('-reg', stu)
          show('step-register')
          document.getElementById('inp-new-pw').focus()
        }
      } catch (err) {
        showMsg('step1-msg', 'เกิดข้อผิดพลาด: ' + (err.message ?? ''), 'error')
      } finally {
        btn.disabled = false; btn.textContent = 'ถัดไป →'
      }
    }

    document.getElementById('btn-next').addEventListener('click', handleNext)
    document.getElementById('inp-code').addEventListener('keydown', e => {
      if (e.key === 'Enter') handleNext()
    })

    // ─── Step 2A: Login ───────────────────────────────────────────────────────
    document.getElementById('btn-login').addEventListener('click', async () => {
      const pw  = document.getElementById('inp-password').value
      const btn = document.getElementById('btn-login')
      if (!pw) { showMsg('login-msg', 'กรุณากรอกรหัสผ่าน', 'error'); return }
      if (!_email) { showMsg('login-msg', 'เกิดข้อผิดพลาด กรุณาเริ่มใหม่', 'error'); goBack(); return }

      btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...'
      hide('login-msg')

      const { error } = await supabase.auth.signInWithPassword({ email: _email, password: pw })
      if (error) {
        showMsg('login-msg', error.message.includes('Invalid') ? 'รหัสผ่านไม่ถูกต้อง' : error.message, 'error')
        btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; return
      }
      showMsg('login-msg', 'เข้าสู่ระบบสำเร็จ ✅', 'success')
      setTimeout(() => { window.location.href = _nextUrl || 'student.html' }, 500)
    })

    document.getElementById('inp-password').addEventListener('keydown', e => {
      if (e.key === 'Enter') document.getElementById('btn-login').click()
    })

    // ─── Step 2B: สร้างบัญชีครั้งแรก ─────────────────────────────────────────
    document.getElementById('btn-create-account').addEventListener('click', async () => {
      const pw  = document.getElementById('inp-new-pw').value
      const pw2 = document.getElementById('inp-confirm-pw').value
      const btn = document.getElementById('btn-create-account')

      if (!pw || pw.length < 6) { showMsg('reg-msg', 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'error'); return }
      if (pw !== pw2)            { showMsg('reg-msg', 'รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'error'); return }

      btn.disabled = true; btn.textContent = 'กำลังสร้างบัญชี...'
      hide('reg-msg')

      try {
        // 1. สร้าง Supabase Auth account
        const { data, error: signUpErr } = await supabase.auth.signUp({
          email: _email,
          password: pw,
          options: {
            data: { full_name: _student.full_name, role: 'student', user_code: _student.student_code }
          }
        })
        if (signUpErr) throw signUpErr

        // 2. รอให้ trigger สร้าง profile record
        await new Promise(r => setTimeout(r, 1000))

        // 3. ผูก profile_id + set role='student' ผ่าน SECURITY DEFINER function
        const { data: linked } = await supabase.rpc('link_student_profile', {
          p_student_code: _student.student_code,
        })
        if (!linked) throw new Error('ผูกบัญชีไม่สำเร็จ กรุณาติดต่อผู้ดูแลระบบ')

        showMsg('reg-msg', 'สร้างบัญชีสำเร็จ 🎉 กำลังเข้าสู่ระบบ...', 'success')
        setTimeout(() => { window.location.href = _nextUrl || 'student.html' }, 800)

      } catch (err) {
        const msg = err.message?.includes('already registered')
          ? 'บัญชีนี้มีอยู่แล้ว กรุณาติดต่อผู้ดูแลระบบ'
          : 'เกิดข้อผิดพลาด: ' + (err.message ?? '')
        showMsg('reg-msg', msg, 'error')
        btn.disabled = false; btn.textContent = 'สร้างบัญชีและเข้าสู่ระบบ'
      }
    })

    // ─── Forgot Password / Recovery Events ────────────────────────────────────
    document.getElementById('btn-forgot-pw')?.addEventListener('click', () => {
      show('modal-forgot-pw')
      document.getElementById('forgot-code').value = document.getElementById('inp-code').value
      hide('forgot-pw-msg')
    })

    document.getElementById('forgot-pw-close')?.addEventListener('click', () => hide('modal-forgot-pw'))

    document.getElementById('forgot-pw-form')?.addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('btn-submit-forgot')
      const code = document.getElementById('forgot-code').value.trim()
      const name = document.getElementById('forgot-name').value.trim()
      const room = document.getElementById('forgot-room').value.trim()
      const email = document.getElementById('forgot-email').value.trim()

      btn.disabled = true; btn.textContent = 'กำลังส่งคำขอ...'
      hide('forgot-pw-msg')

      try {
        // 1. เรียก RPC เพื่อยืนยันตัวตนและผูกอีเมลจริงในระบบหลังบ้าน
        const { data: verified, error: verifyErr } = await supabase.rpc('student_request_password_reset', {
          p_student_code: code,
          p_full_name: name,
          p_main_room: room,
          p_new_email: email
        })

        if (verifyErr) throw verifyErr
        if (!verified) throw new Error('ยืนยันตัวตนไม่สำเร็จ กรุณาตรวจสอบข้อมูลอีกครั้ง')

        // 2. เรียก Supabase Auth ส่งลิงก์รีเซ็ต
        const { error: resetErr } = await supabase.auth.resetPasswordForEmail(email, {
          redirectTo: window.location.origin + window.location.pathname
        })

        if (resetErr) throw resetErr

        showMsg('forgot-pw-msg', 'ส่งลิงก์ตั้งรหัสผ่านใหม่สำเร็จแล้ว กรุณาเช็คกล่องข้อความ!', 'success')
        setTimeout(() => hide('modal-forgot-pw'), 4000)

      } catch(err) {
        showMsg('forgot-pw-msg', err.message || 'รีเซ็ตรหัสผ่านไม่สำเร็จ', 'error')
      } finally {
        btn.disabled = false; btn.textContent = 'ขอลิงก์รีเซ็ตรหัสผ่าน'
      }
    })

    // ─── Catch Recovery Redirect & Listeners ──────────────────────────────────
    supabase.auth.onAuthStateChange(async (event, session) => {
      if (event === 'PASSWORD_RECOVERY') {
        show('modal-reset-pw')
        hide('reset-pw-msg')
      }
    })

    document.getElementById('reset-pw-form')?.addEventListener('submit', async (e) => {
      e.preventDefault()
      const btn = document.getElementById('btn-submit-reset')
      const pw = document.getElementById('reset-pw-new').value
      const pw2 = document.getElementById('reset-pw-confirm').value

      if (pw.length < 6) {
        showMsg('reset-pw-msg', 'รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร', 'error'); return
      }
      if (pw !== pw2) {
        showMsg('reset-pw-msg', 'รหัสผ่านทั้งสองช่องไม่ตรงกัน', 'error'); return
      }

      btn.disabled = true; btn.textContent = 'กำลังบันทึก...'
      hide('reset-pw-msg')

      try {
        const { error } = await supabase.auth.updateUser({ password: pw })
        if (error) throw error

        showMsg('reset-pw-msg', 'เปลี่ยนรหัสผ่านสำเร็จแล้ว! กำลังเข้าสู่ระบบ...', 'success')
        setTimeout(() => { window.location.href = 'student.html' }, 1500)

      } catch(err) {
        showMsg('reset-pw-msg', err.message || 'บันทึกรหัสผ่านใหม่ไม่สำเร็จ', 'error')
        btn.disabled = false; btn.textContent = 'บันทึกรหัสผ่านใหม่'
      }
    })

    })() // end IIFE
  </script>
</body>
</html>
