<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ปพ.5 ออนไลน์ — เข้าสู่ระบบนักเรียน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/main.css" />
</head>

<body class="login-bg flex items-center justify-center min-h-screen p-4">

  <div class="login-card rounded-3xl shadow-2xl w-full max-w-sm p-8">

    <!-- Logo + Title -->
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-emerald-100 flex items-center justify-center mb-4 text-3xl">🎒</div>
      <h1 class="text-2xl font-bold text-gray-800 tracking-tight">เข้าสู่ระบบนักเรียน</h1>
      <p id="school-name" class="text-sm text-gray-400 mt-1">ปพ.5 ออนไลน์</p>
    </div>

    <!-- Login Form -->
    <form id="stu-login-form" novalidate class="space-y-5">

      <div>
        <label for="stu-code" class="block text-sm font-medium text-gray-700 mb-1">
          รหัสนักเรียน
        </label>
        <input id="stu-code" type="text" inputmode="numeric"
          autocomplete="username"
          placeholder="เช่น 26826"
          required
          class="input-field w-full border border-gray-300 rounded-xl px-4 py-3 text-sm text-gray-800 placeholder-gray-400 font-mono tracking-wider" />
      </div>

      <div>
        <label for="stu-password" class="block text-sm font-medium text-gray-700 mb-1">
          รหัสผ่าน
        </label>
        <div class="relative">
          <input id="stu-password" type="password"
            autocomplete="current-password"
            placeholder="••••••••"
            required
            class="input-field w-full border border-gray-300 rounded-xl px-4 py-3 pr-12 text-sm text-gray-800 placeholder-gray-400" />
          <button type="button" id="stu-toggle-pw"
            class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-lg leading-none"
            tabindex="-1">
            <span id="stu-eye-icon">👁️</span>
          </button>
        </div>
      </div>

      <div id="stu-login-msg" class="hidden text-sm text-center py-2.5 rounded-xl"></div>

      <button id="btn-stu-login" type="submit"
        class="btn-primary w-full text-white font-semibold py-3 rounded-xl text-sm">
        เข้าสู่ระบบ
      </button>

    </form>

    <!-- Link back to teacher login -->
    <p class="text-center text-xs text-gray-400 mt-6">
      คุณครู?
      <a href="index.html" class="text-indigo-500 hover:text-indigo-700 font-medium">เข้าสู่ระบบครู →</a>
    </p>

  </div>

  <script type="module">
    import { supabase } from '/js/supabase.js'

    // ─── Check if already logged in ──────────────────────────────────────────
    const { data: { session } } = await supabase.auth.getSession()
    if (session) {
      const { data: profile } = await supabase
        .from('profiles').select('role').eq('id', session.user.id).single()
      if (profile?.role === 'student') { window.location.replace('student.html'); }
    }

    // ─── Load school name from system_config ─────────────────────────────────
    try {
      const { data } = await supabase.from('system_config').select('key, value')
        .in('key', ['schoolName'])
      const cfg = Object.fromEntries((data ?? []).map(r => [r.key, r.value]))
      if (cfg.schoolName) document.getElementById('school-name').textContent = cfg.schoolName
    } catch { /* ไม่แสดง error ถ้าโหลด config ไม่ได้ */ }

    // ─── Toggle password ─────────────────────────────────────────────────────
    document.getElementById('stu-toggle-pw').addEventListener('click', () => {
      const inp = document.getElementById('stu-password')
      const ico = document.getElementById('stu-eye-icon')
      inp.type = inp.type === 'password' ? 'text' : 'password'
      ico.textContent = inp.type === 'password' ? '👁️' : '🙈'
    })

    // ─── Login ────────────────────────────────────────────────────────────────
    function showMsg(text, type) {
      const el = document.getElementById('stu-login-msg')
      el.className = `text-sm text-center py-2.5 rounded-xl ${
        type === 'error' ? 'bg-red-50 text-red-600' : 'bg-emerald-50 text-emerald-700'
      }`
      el.textContent = text
      el.classList.remove('hidden')
    }

    document.getElementById('stu-login-form').addEventListener('submit', async e => {
      e.preventDefault()
      const code = document.getElementById('stu-code').value.trim()
      const password = document.getElementById('stu-password').value
      const btn = document.getElementById('btn-stu-login')
      const msg = document.getElementById('stu-login-msg')

      if (!code || !password) { showMsg('กรุณากรอกรหัสนักเรียนและรหัสผ่าน', 'error'); return }

      btn.disabled = true; btn.textContent = 'กำลังเข้าสู่ระบบ...'
      msg.classList.add('hidden')

      try {
        // 1. หา profile_id จาก student_code
        const { data: stu } = await supabase
          .from('students')
          .select('profile_id')
          .eq('student_code', code)
          .not('profile_id', 'is', null)
          .maybeSingle()

        if (!stu?.profile_id) {
          showMsg('ไม่พบรหัสนักเรียนนี้ในระบบ หรือยังไม่ได้สร้างบัญชี', 'error')
          btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; return
        }

        // 2. ดึง email จาก resolve function
        const { data: email, error: rpcErr } = await supabase
          .rpc('resolve_student_login_email', { p_profile_id: stu.profile_id })

        if (rpcErr || !email) {
          showMsg('ไม่พบอีเมลสำหรับบัญชีนี้ กรุณาติดต่อผู้ดูแลระบบ', 'error')
          btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; return
        }

        // 3. Login ด้วย email + password
        const { error } = await supabase.auth.signInWithPassword({ email, password })
        if (error) {
          showMsg(error.message.includes('Invalid') ? 'รหัสผ่านไม่ถูกต้อง' : error.message, 'error')
          btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'; return
        }

        showMsg('เข้าสู่ระบบสำเร็จ ✅', 'success')
        setTimeout(() => { window.location.href = 'student.html' }, 600)

      } catch (err) {
        showMsg('เกิดข้อผิดพลาด: ' + (err.message ?? ''), 'error')
        btn.disabled = false; btn.textContent = 'เข้าสู่ระบบ'
      }
    })
  </script>
</body>
</html>
